# SparkLaw lightweight deployment for small servers (2C/2G).
# Start with: docker compose -f docker-compose.lite.yml up -d --build

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REQUIREMENTS_FILE: requirements-lite.txt
    container_name: sparklaw-backend-lite
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - APP_NAME=SparkLaw
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LLM_MODE=${LLM_MODE:-cloud}
      - LLM_PROVIDER_ORDER=${LLM_PROVIDER_ORDER:-deepseek,openai,groq}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_BASE_URL=${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.1-8b-instant}
      - OPENAI_TEMPERATURE=${OPENAI_TEMPERATURE:-0.3}
      - OPENAI_MAX_TOKENS=${OPENAI_MAX_TOKENS:-2048}
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - AUTH_ALLOW_REGISTRATION=${AUTH_ALLOW_REGISTRATION:-true}
      - AUTH_REGISTRATION_INVITE_CODE=${AUTH_REGISTRATION_INVITE_CODE:-}
      - AUTH_DB_PATH=/app/data/sparklaw.sqlite3
      - AUTH_COOKIE_NAME=${AUTH_COOKIE_NAME:-sparklaw_session}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-false}
      - AUTH_COOKIE_SAMESITE=${AUTH_COOKIE_SAMESITE:-lax}
      - AUTH_SESSION_TTL_DAYS=${AUTH_SESSION_TTL_DAYS:-14}
      - AUTH_PASSWORD_MIN_LENGTH=${AUTH_PASSWORD_MIN_LENGTH:-10}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}
      - ENABLE_OBSERVABILITY=false
      - ENABLE_SEMANTIC_MEMORY=false
      - ENABLE_SEMANTIC_CACHE=false
      - DEFAULT_JURISDICTION=${DEFAULT_JURISDICTION:-中国}
    volumes:
      - backend_data:/app/data
      - backend_logs:/app/logs
    networks:
      - sparklaw-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - BACKEND_INTERNAL_URL=${BACKEND_INTERNAL_URL:-http://backend:8000}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
    container_name: sparklaw-frontend-lite
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - BACKEND_INTERNAL_URL=${BACKEND_INTERNAL_URL:-http://backend:8000}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sparklaw-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

networks:
  sparklaw-network:
    driver: bridge

volumes:
  backend_data:
  backend_logs:
