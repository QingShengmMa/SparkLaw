# =============================================================
# SparkLaw — Docker Compose
# 一键启动：docker compose up -d --build
# =============================================================

services:

  # ── Redis（会话 / Celery broker）─────────────────────────────
  redis:
    image: redis:7.4.2-alpine
    container_name: sparklaw-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - sparklaw-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Qdrant（分布式向量数据库）─────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: sparklaw-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - sparklaw-network
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI 后端 ──────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sparklaw-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      # App
      - APP_NAME=SparkLaw
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # LLM
      - LLM_MODE=${LLM_MODE:-cloud}
      - LLM_PROVIDER_ORDER=${LLM_PROVIDER_ORDER:-groq,deepseek}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_BASE_URL=${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.1-8b-instant}
      - GROQ_INPUT_COST_PER_1M=${GROQ_INPUT_COST_PER_1M:-0.05}
      - GROQ_OUTPUT_COST_PER_1M=${GROQ_OUTPUT_COST_PER_1M:-0.08}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - DEEPSEEK_INPUT_COST_PER_1M=${DEEPSEEK_INPUT_COST_PER_1M:-0.27}
      - DEEPSEEK_OUTPUT_COST_PER_1M=${DEEPSEEK_OUTPUT_COST_PER_1M:-1.10}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OPENAI_TEMPERATURE=${OPENAI_TEMPERATURE:-0.3}
      - OPENAI_MAX_TOKENS=${OPENAI_MAX_TOKENS:-2048}
      # Auth
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - AUTH_ALLOW_REGISTRATION=${AUTH_ALLOW_REGISTRATION:-true}
      - AUTH_REGISTRATION_INVITE_CODE=${AUTH_REGISTRATION_INVITE_CODE:-}
      - AUTH_DB_PATH=/app/data/sparklaw.sqlite3
      - AUTH_COOKIE_NAME=${AUTH_COOKIE_NAME:-sparklaw_session}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-false}
      - AUTH_COOKIE_SAMESITE=${AUTH_COOKIE_SAMESITE:-lax}
      - AUTH_SESSION_TTL_DAYS=${AUTH_SESSION_TTL_DAYS:-14}
      - AUTH_PASSWORD_MIN_LENGTH=${AUTH_PASSWORD_MIN_LENGTH:-10}
      # Ollama (local mode)
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
      # CORS
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}
      # Redis / Celery
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      # Vector DB (Qdrant)
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - QDRANT_COLLECTION_CONTRACTS=${QDRANT_COLLECTION_CONTRACTS:-legal_contracts}
      - QDRANT_COLLECTION_LAWS=${QDRANT_COLLECTION_LAWS:-legal_corpus}
      - QDRANT_VECTOR_SIZE=${QDRANT_VECTOR_SIZE:-512}
      - ENABLE_SEMANTIC_MEMORY=${ENABLE_SEMANTIC_MEMORY:-false}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
      # 兼容旧配置（用于数据迁移）
      - CHROMA_PERSIST_DIR=/app/data/chroma
      # Jurisdiction
      - DEFAULT_JURISDICTION=${DEFAULT_JURISDICTION:-中国}
    volumes:
      - backend_data:/app/data
      - backend_logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - sparklaw-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  # ── Next.js 前端（生产构建）───────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - BACKEND_INTERNAL_URL=${BACKEND_INTERNAL_URL:-http://backend:8000}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
    container_name: sparklaw-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - BACKEND_INTERNAL_URL=${BACKEND_INTERNAL_URL:-http://backend:8000}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sparklaw-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

networks:
  sparklaw-network:
    driver: bridge

volumes:
  redis_data:
  qdrant_storage:
  backend_data:
  backend_logs:
